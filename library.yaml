default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

library:
  skills:
    - name: claude-config
      description: Repo-backed Claude Code configuration workflow — edits source-of-truth files and runs install.sh to sync
      source: https://github.com/juliaaano/skills/blob/main/claude-config/SKILL.md

    - name: commit
      description: Generate a single-line git commit message from staged changes
      source: https://github.com/juliaaano/skills/blob/main/commit/SKILL.md

    - name: daily-entry
      description: Create a structured daily work entry in the wiki .raw folder
      source: https://github.com/juliaaano/skills/blob/main/daily-entry/SKILL.md

    - name: jira-create
      description: Create Jira issues from free text, logs, links, or descriptions with ADF formatting
      source: https://github.com/juliaaano/skills/blob/main/jira-create/SKILL.md

    - name: jira-search
      description: Search, filter, and retrieve Jira issues by key, assignee, status, labels, or any keyword
      source: https://github.com/juliaaano/skills/blob/main/jira-search/SKILL.md

    - name: search
      description: Search the web and answer questions using up-to-date information from the internet
      source: https://github.com/juliaaano/skills/blob/main/search/SKILL.md

    - name: summary
      description: Summarize recent git activity across multiple repositories with sync, committer stats, and per-repo details
      source: https://github.com/juliaaano/skills/blob/main/summary/SKILL.md

    - name: showroom-skills
      description: Install showroom skills, agents, prompts, templates, and docs from the RHDP Skills Marketplace
      source: https://github.com/juliaaano/skills/blob/main/showroom-skills/SKILL.md

    - name: quarterly-connection
      description: Guide through Red Hat Quarterly Connection self-evaluation with section-by-section drafting, Workday formatting, and iterative refinement
      source: https://github.com/juliaaano/skills/blob/main/quarterly-connection/SKILL.md

    - name: pdf
      description: Read, create, merge, split, rotate, watermark, encrypt, OCR, and manipulate PDF files
      source: https://github.com/anthropics/skills/blob/main/skills/pdf/SKILL.md

    - name: playwright-cli
      description: Automates browser interactions for web testing, form filling, screenshots, and data extraction
      source: https://github.com/microsoft/playwright-cli/blob/main/skills/playwright-cli/SKILL.md

    - name: scrape
      description: Scrape a web page using Firecrawl and answer questions about its content
      source: https://github.com/juliaaano/skills/blob/main/scrape/SKILL.md

    - name: search-company-knowledge
      description: Search across company knowledge bases (Confluence, Jira, internal docs) to find and explain internal concepts, processes, and technical details
      source: https://github.com/juliaaano/skills/blob/main/search-company-knowledge/SKILL.md
      # upstream: https://github.com/atlassian/atlassian-mcp-server/blob/main/skills/search-company-knowledge/SKILL.md

    - name: skill-creator
      description: Create new skills, modify and improve existing skills, and measure skill performance
      source: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
  agents: []
  prompts: []
